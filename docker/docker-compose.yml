# Family Finance behind a Cloudflare Tunnel. Run from docker/:
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
# (GIT_COMMIT is optional; it labels the version in the owner's Logs.)
# Setup (tunnel token, Cloudflare route and Access policy) is described in the README.
# Without a name, Compose would call the project "docker" after this folder.
name: financedashboard

services:
  finance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: family-finance
    restart: unless-stopped
    # Only reachable from this machine; everyone else comes in through the tunnel.
    ports:
      - "127.0.0.1:8082:8080"
    # Optional settings (TZ, SEED_*, ...) — see .env.example at the repo root.
    env_file:
      - path: ../.env
        required: false
    # Fixed container settings; these override any values in .env.
    environment:
      PORT: "8080"
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      # Keep forwarded headers untrusted; all tunnel visitors share an IP limit.
      TRUST_PROXY: "false"
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    depends_on:
      finance:
        condition: service_healthy
    secrets:
      - tunnel_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
