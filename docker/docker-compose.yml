services:
  finance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: family-finance
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Optional settings (COOKIE_SECURE, SEED_*) — see .env.example at the repo root.
    env_file:
      - path: ../.env
        required: false
    # Fixed container paths; these override any dev values in .env.
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - ./data:/data
