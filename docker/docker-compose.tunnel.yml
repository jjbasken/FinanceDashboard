# Standalone alternative to docker-compose.yml; uses the same database directory.
# Run from docker/: docker compose -f docker-compose.tunnel.yml up -d --build
services:
  finance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: family-finance
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      # Keep forwarded headers untrusted; all tunnel visitors share an IP limit.
      TRUST_PROXY: "false"
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    depends_on:
      finance:
        condition: service_healthy
    secrets:
      - tunnel_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
